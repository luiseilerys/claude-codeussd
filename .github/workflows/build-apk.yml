name: Build APK

# Se ejecuta automáticamente en cada push/PR y también "a demanda":
# Actions → Build APK → Run workflow (workflow_dispatch).
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de compilación'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      version_name:
        description: 'versionName opcional (p. ej. 1.1) — se inyecta en el build'
        required: false
        default: ''
        type: string
  push:
    branches: [main, herramientasapk]
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar HerramientasAPK (Android 5.0+)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle wrapper
        run: |
          # El repo no incluye gradlew binario; lo genera Gradle oficial 8.4
          if [ ! -f gradlew ]; then
            wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /opt
            /opt/gradle-8.4/bin/gradle wrapper --gradle-version 8.4 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Inyectar versionName (si se indicó)
        if: ${{ github.event.inputs.version_name != '' }}
        run: |
          sed -i "s/versionName \".*\"/versionName \"${{ github.event.inputs.version_name }}\"/" app/build.gradle
          grep versionName app/build.gradle

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Compilar APK
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          ./gradlew --no-daemon assemble"$BUILD_TYPE" \
            -Pandroid.useAndroidX=false --stacktrace
          echo "APK_PATH=$(find app/build/outputs/apk -name '*.apk' | head -1)" >> "$GITHUB_ENV"
          echo "BUILD_USED=$BUILD_TYPE" >> "$GITHUB_ENV"

      - name: Renombrar artefacto
        run: |
          cp "$APK_PATH" "herramientasapk-${BUILD_USED}.apk"
          ls -la herramientasapk-*.apk
          sha256sum herramientasapk-*.apk | tee herramientasapk.sha256

      - name: Subir artefacto del workflow
        uses: actions/upload-artifact@v4
        with:
          name: herramientasapk-${{ env.BUILD_USED }}
          path: |
            herramientasapk-*.apk
            herramientasapk.sha256
          if-no-files-found: error

      # Cada "Run workflow" deja la APK publicada como Release con nombre único
      - name: Crear Release con la APK
        if: success() && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: HerramientasAPK (build ${{ github.run_number }})
          body: |
            APK generada por el workflow "Build APK" (Run workflow).
            - Herramientas de virb3/apk-utilities adaptadas a Android 5.0+ (API 21), sin ADB.
            - Tipo: ${{ env.BUILD_USED }} · commit ${{ github.sha }}
            - SHA-256 disponible en los assets.
          files: |
            herramientasapk-${{ env.BUILD_USED }}.apk
            herramientasapk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
