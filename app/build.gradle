plugins {
    id 'com.android.application'
}

android {
    // Fix "package R does not exist": los fuentes de la app (MainActivity,
    // Dialer, FloatService...) estan en el paquete cu.codigos.ussd y usan R
    // sin import, es decir esperan cu.codigos.ussd.R. AAPT2 genera la clase R
    // SIEMPRE en el paquete indicado por "namespace"; con namespace
    // 'com.herramientas.apk' el R generado no coincidia con el que el codigo
    // resuelve -> decenas de errores "package R does not exist". Se unifica
    // el namespace con el paquete real del codigo. El applicationId puede
    // seguir siendo otro (identificador de instalacion), pero se mantiene
    // igual para evitar ambiguedad.
    namespace 'cu.codigos.ussd'
    compileSdk 34

    // AGP 8.x: se declaran explicitamente las build features usadas.
    // "resValues true" fuerza el procesamiento de valores de recursos;
    // ojo: la generacion de R.java NO es una opcion de buildFeatures en
    // AGP 8.x (nombres como rClassGeneration rompen el build) — R la
    // genera AAPT2 automaticamente mientras el namespace sea valido y los
    // recursos compilen.
    buildFeatures {
        aidl false
        buildConfig true
        dataBinding false
        mlModelBinding false
        renderScript false
        resValues true
        shaders false
        viewBinding false
    }

    defaultConfig {
        applicationId "cu.codigos.ussd"
        minSdk 21          // Android 5.0 Lollipop
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // firma con keystore debug; cambia en producción
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Fix "cannot find symbol R / package R does not exist": la generacion
    // de la clase R no es una opcion de buildFeatures en AGP 8.x (ahi solo
    // existen flags como viewBinding, aidl, resValues, etc.; un nombre
    // invalido como rClassGeneration rompe el build en esta linea). La
    // clase R.java SIEMPRE la genera AAPT2; se controla unicamente mediante
    // la propiedad android.rclass.enabled (true) y android.nonTransitiveRClass
    // (false), ambas declaradas en gradle.properties.
    // Ademas, useLibrary habilita org.apache.http.legacy, que algunas
    // librerias empaquetadas (apktool) referencian; sin el aparecen errores
    // de "missing method/field references in library classes".
    useLibrary 'org.apache.http.legacy'

    // Los JARs de apktool/smali/baksmali se empaquetan como libs para uso in-app
    packagingOptions {
        jniLibs { useLegacyPackaging = true }
    }

    // Fix "Android resource linking failed": los styles (Theme.CodigosCuba,
    // BtnDial, BtnGhost...) heredan de Theme.Material3 y usan attrs como
    // colorPrimary, backgroundTint, cornerRadius, strokeColor y
    // selectableItemBackground. Esos atributos solo existen en la librería
    // Material Components; sin esta dependencia AAPT2 no los encuentra.
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Dependencias requeridas por el código (androidx.appcompat, recyclerview)
    // y por los temas/styles Material3 de res/values/themes.xml.
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.11.0'
}
