plugins {
    id 'com.android.application'
}

android {
    namespace 'com.herramientas.apk'
    compileSdk 34

    defaultConfig {
        applicationId "com.herramientas.apk"
        minSdk 21          // Android 5.0 Lollipop
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // firma con keystore debug; cambia en producción
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Los JARs de apktool/smali/baksmali se empaquetan como libs para uso in-app
    packagingOptions {
        jniLibs { useLegacyPackaging = true }
    }

    // Fix "Android resource linking failed": los styles (Theme.CodigosCuba,
    // BtnDial, BtnGhost...) heredan de Theme.Material3 y usan attrs como
    // colorPrimary, backgroundTint, cornerRadius, strokeColor y
    // selectableItemBackground. Esos atributos solo existen en la librería
    // Material Components; sin esta dependencia AAPT2 no los encuentra.
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Dependencias requeridas por el código (androidx.appcompat, recyclerview)
    // y por los temas/styles Material3 de res/values/themes.xml.
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.11.0'
}
