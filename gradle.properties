org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Fix: el codigo fuente usa imports androidx.* (AppCompatActivity, RecyclerView,
# NotificationCompat...), por lo que AndroidX DEBE estar habilitado. Con
# useAndroidX=false el build fallaba ademas de aportar los attrs de Material.
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=false
# Fix "Missing R class generation": fuerza explicitamente la generacion de
# R.java por AAPT2; si esta propiedad estuviera en false, todas las
# referencias (R.layout.activity_main, R.id.etSearch, ...) darian
# "cannot find symbol" y el build fallaria con decenas de errores.
android.rclass.enabled=true
